# Keeps Formula/ssp.rb on the latest release of sub-screen-player: checks every hour (or when
# run by hand, optionally for a given tag), installs the new formula on macOS and Linux, and
# commits it only when both work.
name: Update

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release to use, e.g. v0.5.1 (default the latest)
        required: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.write.outputs.changed }}
      version: ${{ steps.write.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: write
        env:
          TAG: ${{ inputs.tag }}
        run: |
          sh update.sh $TAG
          echo "version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/ssp.rb)" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
      - if: steps.write.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: formula
          path: Formula/ssp.rb

  test:
    needs: formula
    if: needs.formula.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: formula
          path: Formula
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install from this checkout
        run: |
          # Homebrew installs formulae from taps only; this checkout becomes the tap.
          tap="$(brew --repository)/Library/Taps/nomunomu0504/homebrew-tap"
          rm -rf "$tap" && mkdir -p "$(dirname "$tap")" && cp -R "$GITHUB_WORKSPACE" "$tap"
          brew style nomunomu0504/tap/ssp
          brew install nomunomu0504/tap/ssp
          brew test nomunomu0504/tap/ssp
          ssp --version

  commit:
    needs: [formula, test]
    if: needs.formula.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: formula
          path: Formula
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ssp.rb
          git commit -m "ssp ${{ needs.formula.outputs.version }}"
          git push
